[package]
name = "clicktranslate"
version = "1.0.0"
description = "Herramienta personal de traducción visual para mangas, manhwas y cómics"
authors = ["Anthony Macias <anthoxbv@gmail.com>"]
edition = "2021"

[lib]
name = "clicktranslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-clipboard-manager = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
